name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: Detection quality on 8 simulated hours
        run: PYTHONPATH=src python -m fleetstream.run_local --vehicles 50 --minutes 480
